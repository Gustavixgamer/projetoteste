<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style1.css" rel="stylesheet">
    <title>calculater</title>
</head>
<body>
    
    <div class="center">
        <h1>MEGA CALCULATER</h1>
        <div class="NumberBar" translate="no"></div>
        <button id="b1" class="button">1</button>
        <button id="b2" class="button">2</button>
        <button id="b3" class="button">3</button><br>
        <button id="b4" class="button">4</button>
        <button id="b5" class="button">5</button>
        <button id="b6" class="button">6</button><br>
        <button id="b7" class="button">7</button>
        <button id="b8" class="button">8</button>
        <button id="b9" class="button">9</button><br>
        <button id="bPoint" class="button">.</button>
        <button id="b0" class="button">0</button>
        <button id="bEqual" class="button">=</button>
        <button id="bComma" class="button">,</button>
        <button id="bSubtraction" class="button">-</button>
        <button id="bSum" class="button">+</button>
        <button id="bDel" class="button">Del</button>
        <button id="bC" class="button">C</button>
        <button id="bDiv" class="button">/</button>
        <button id="bMultiply" class="button">*</button>
        <button id="bHigh" class="button">^</button>
        <button id="bPi" class="button">π</button>
        <button id="bParenthesisOpen" class="button">(</button>
        <button id="bParenthesisClose" class="button">)</button>
        <button id="bFactorial" class="button">!</button>
        <button id="bE" class="button">e</button>
        <button id="bSqrt" class="button">√</button>
        <button id="bLog2" class="button">Log₂X</button>
        <button id="bLog10" class="button">LogX</button>
        <button id="bLogₐX" class="button"> LogₐX</button>

    </div>
    
    
    
    
    
    
    <script src="script1.js"></script>
</body>
</html>
